version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      # Update the installer before resolving CPU-wheel metadata.
      - python -m pip install --upgrade pip
      - >-
        python -m pip install "torch>=2.3,<3" --only-binary=:all:
        --index-url https://download.pytorch.org/whl/cpu
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - data
