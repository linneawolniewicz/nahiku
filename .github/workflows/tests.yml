name: Nahiku checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  numerical-and-docs:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      NAHIKU_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[data,test,docs]' build
      - name: Numerical tests
        run: python -m pytest --cov=nahiku --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml
      - name: Execute synthetic example and tutorials
        run: python scripts/check_notebooks.py
      - name: Strict documentation build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Build distribution
        run: python -m build
      - name: Verify wheel away from source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'from nahiku import Nahiku, __version__; assert __version__ == "0.2.0"; Nahiku.from_synthetic_noise(n_points=20)'
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-and-distributions
          path: |
            docs/_build/html
            dist
            htmlcov
            coverage.xml
